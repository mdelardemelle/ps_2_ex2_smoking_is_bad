# Run from the repository folder after activating your Pixi environment:
#   pre-commit install
#   pre-commit run --all-files
minimum_pre_commit_version: "3.2.0"
default_language_version:
  python: python3.12
exclude: ^(\.pixi/|\.git/)

repos:
  # Required by the exercise: remove saved notebook outputs before committing.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # The four basic hooks shown in Lecture 2.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Ruff handles Python whitespace; notebooks need notebook-aware tools.
        exclude: \.(py|pyi|ipynb)$
      - id: end-of-file-fixer
        exclude: \.(py|pyi|ipynb)$
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]

  # Ruff replaces Black and Flake8, and checks notebook code directly.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-format
        types_or: [python, pyi, jupyter]
        args: [--line-length=80, --target-version=py312]
      - id: ruff-check
        args:
          # Basic errors, unused imports, long lines, missing type hints,
          # and unused function arguments. Prefix unused arguments with _.
          - --select=E4,E7,E9,F,E501,ANN,ARG
          - --line-length=80
          - --target-version=py312

  # Lecture 1: check that types agree in Python scripts (not .ipynb files).
  # Third-party libraries without available type information are skipped.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args:
          - --python-version=3.12
          - --ignore-missing-imports
          - --check-untyped-defs
